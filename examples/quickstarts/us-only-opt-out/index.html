<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>libreconsent US-only opt-out quickstart</title>
    <style>
      body { margin: 0; font: 16px/1.6 system-ui, sans-serif; color: #17202a; background: #f5f7fa; }
      main, footer { max-width: 48rem; margin: 0 auto; padding: 3rem 1.5rem; }
      footer { padding-block-start: 0; }
      output { padding: .2rem .4rem; border-radius: .25rem; background: #e8eef5; }
      button, a { font: inherit; }
    </style>
    <script>
      window.libreconsentConsentMode = {
        enabled: true,
        defaults: "denied-everywhere",
        waitForUpdate: 500,
      };
    </script>
    <!-- LIBRECONSENT_HEAD_SNIPPET -->
    <script type="text/plain" data-cmp-category="analytics" src="/quickstarts/us-only-opt-out/analytics.js"></script>
    <script type="text/plain" data-cmp-category="marketing" src="/quickstarts/us-only-opt-out/ads.js"></script>
  </head>
  <body>
    <main>
      <h1>US-only opt-out quickstart</h1>
      <p>
        Region resolution uses a same-origin endpoint. US visitors receive an
        in-memory implied grant unless GPC or an explicit opt-out applies.
      </p>
      <p>Analytics: <output id="analytics-status">blocked</output></p>
      <p>Advertising: <output id="ads-status">blocked</output></p>
      <p><button type="button" data-cmp-open>Privacy preferences</button></p>
    </main>
    <footer>
      <a id="do-not-sell" href="#do-not-sell">Do Not Sell or Share My Personal Information</a>
    </footer>
    <script src="/dist/core.global.js"></script>
    <script src="/dist/ui.global.js"></script>
    <script>
      async function resolveRegion() {
        try {
          const response = await fetch("/api/region", {
            credentials: "same-origin",
            headers: { accept: "application/json" },
          });
          if (!response.ok) return null;
          const body = await response.json();
          return typeof body.region === "string" ? body.region : null;
        } catch {
          return null;
        }
      }

      window.__quickstartApi = LibreConsentCore.init({
        categories: [
          {
            id: "analytics",
            label: "category.analytics.label",
            description: "category.analytics.description",
          },
          {
            id: "marketing",
            label: "category.marketing.label",
            description: "category.marketing.description",
          },
        ],
        consentMode: window.libreconsentConsentMode,
        resolveRegion,
        usPrivacy: {
          enabled: true,
          regions: ["US"],
          doNotSellSelector: "#do-not-sell",
          respectGPC: true,
        },
        i18n: {
          translations: {
            en: {
              "category.analytics.label": "Analytics",
              "category.analytics.description": "Measures use of this site.",
              "category.marketing.label": "Advertising",
              "category.marketing.description": "Supports targeted advertising.",
            },
          },
        },
      });
      window.__quickstartUi = LibreConsentUi.mount(window.__quickstartApi);
    </script>
  </body>
</html>
